package: squid

essential:
  - squid_copyright

slices:
  # Main squid binary
  bins:
    essential:
      # Libraries
      - libc6_libs
      - libcap2_libs
      - libcom-err2_libs
      - libcrypt1_libs
      - libecap3_libs
      - libexpat1_libs
      - libgcc-s1_libs
      - libgnutls30t64_libs
      - libgssapi-krb5-2_libs
      - libkrb5-3_libs
      - libldap2_libs
      - libltdl7_libs
      - libnetfilter-conntrack3_libs
      - libnettle8t64_libs
      - libpam0g_libs
      - libsasl2-2_libs
      - libstdc++6_libs
      - libsystemd0_libs
      - libtdb1_libs
      - libxml2-16_libs
      # Config and directories
      - squid_config
      - squid_var
      - squid-common_icons
    contents:
      /usr/sbin/squid-gnutls:

  # Configuration files
  config:
    contents:
      /etc/squid/squid.conf:
      /etc/squid/errorpage.css:
      /etc/squid/conf.d/debian.conf:
      /usr/lib/tmpfiles.d/squid.conf:

  # Systemd service file
  service:
    contents:
      /usr/lib/systemd/system/squid.service:

  # Init script (for systems without systemd)
  init:
    contents:
      /etc/init.d/squid:

  # Log rotation configuration
  logrotate:
    contents:
      /etc/logrotate.d/squid:

  # Runtime and cache directories
  var:
    contents:
      /var/log/squid/: {make: true, mode: 0750}
      /var/spool/squid/: {make: true, mode: 0750}

  # Authentication helpers
  auth-helpers:
    essential:
      - libc6_libs
      - libcrypt1_libs
      - libgcc-s1_libs
      - libpam0g_libs
      - libsasl2-2_libs
      - libstdc++6_libs
    contents:
      /usr/lib/squid/basic_db_auth:
      /usr/lib/squid/basic_fake_auth:
      /usr/lib/squid/basic_getpwnam_auth:
      /usr/lib/squid/basic_ldap_auth:
      /usr/lib/squid/basic_ncsa_auth:
      /usr/lib/squid/basic_pam_auth:
      /usr/lib/squid/basic_pop3_auth:
      /usr/lib/squid/basic_radius_auth:
      /usr/lib/squid/basic_sasl_auth:
      /usr/lib/squid/basic_smb_auth:
      /usr/lib/squid/basic_smb_auth.sh:
      /usr/lib/squid/digest_file_auth:
      /usr/lib/squid/digest_ldap_auth:
      /usr/lib/squid/negotiate_kerberos_auth:
      /usr/lib/squid/negotiate_kerberos_auth_test:
      /usr/lib/squid/negotiate_wrapper_auth:
      /usr/lib/squid/ntlm_fake_auth:
      /usr/lib/squid/ntlm_smb_lm_auth:

  # ACL helpers
  acl-helpers:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libstdc++6_libs
    contents:
      /usr/lib/squid/ext_file_userip_acl:
      /usr/lib/squid/ext_kerberos_ldap_group_acl:
      /usr/lib/squid/ext_ldap_group_acl:
      /usr/lib/squid/ext_session_acl:
      /usr/lib/squid/ext_sql_session_acl:
      /usr/lib/squid/ext_time_quota_acl:
      /usr/lib/squid/ext_unix_group_acl:
      /usr/lib/squid/ext_wbinfo_group_acl:

  # URL rewrite helpers
  url-helpers:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libstdc++6_libs
    contents:
      /usr/lib/squid/storeid_file_rewrite:
      /usr/lib/squid/url_fake_rewrite:
      /usr/lib/squid/url_fake_rewrite.sh:

  # Log and certificate helpers
  helpers:
    essential:
      - libc6_libs
      - libgcc-s1_libs
      - libstdc++6_libs
    contents:
      /usr/lib/squid/cert_tool:
      /usr/lib/squid/diskd:
      /usr/lib/squid/helper-mux:
      /usr/lib/squid/log_db_daemon:
      /usr/lib/squid/log_file_daemon:
      /usr/lib/squid/pinger:
      /usr/lib/squid/security_fake_certverify:
      /usr/lib/squid/unlinkd:

  # AppArmor profile
  apparmor:
    contents:
      /etc/apparmor.d/usr.sbin.squid:

  # UFW firewall rules
  ufw:
    contents:
      /etc/ufw/applications.d/squid:

  # Resolvconf integration
  resolvconf:
    contents:
      /etc/resolvconf/update-libc.d/squid:

  copyright:
    contents:
      /usr/share/doc/squid/copyright:
